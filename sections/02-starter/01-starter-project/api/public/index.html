<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>メモ</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
    form, section { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    input, textarea { display: block; margin: 0.25rem 0 0.75rem; padding: 0.4rem; width: 100%; box-sizing: border-box; }
    ul { list-style: none; padding: 0; }
    li { border-top: 1px solid #eee; padding: 0.5rem 0; }
    li p { margin: 0.25rem 0; white-space: pre-wrap; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>メモ</h1>
  <p id="message" class="error"></p>

  <form id="new-note">
    <h2>メモを追加する</h2>
    <label>タイトル <input name="title" required maxlength="100"></label>
    <label>本文 <textarea name="body" maxlength="1000"></textarea></label>
    <button>追加する</button>
  </form>

  <section>
    <h2>メモの一覧</h2>
    <ul id="notes"></ul>
  </section>

  <script type="module">
    const message = document.querySelector('#message');
    const list = document.querySelector('#notes');

    // API を呼ぶ。この HTML と API は同じサーバー（http://localhost:3000）から出ているので、パスだけで呼べる
    async function api(method, path, body) {
      const headers = {};
      if (body) headers['content-type'] = 'application/json';
      const response = await fetch(path, { method, headers, body: body && JSON.stringify(body) });
      if (!response.ok) {
        // NestJS のエラーは {"message": ..., "statusCode": ...} の形で返る
        const error = await response.json().catch(() => ({}));
        throw new Error(`${response.status} ${error.message ?? response.statusText}`);
      }
      return response.status === 204 ? null : response.json();
    }

    function showError(error) {
      message.textContent = error.message;
    }

    async function loadNotes() {
      list.replaceChildren();
      try {
        const notes = await api('GET', '/notes');
        message.textContent = '';
        if (notes.length === 0) list.textContent = 'メモはまだありません';
        for (const note of notes) {
          // textContent で入れる（innerHTML にすると、メモに書いた HTML が動いてしまう）
          const item = document.createElement('li');
          const title = document.createElement('strong');
          title.textContent = note.title;
          const body = document.createElement('p');
          body.textContent = note.body;
          const remove = document.createElement('button');
          remove.textContent = '削除';
          remove.addEventListener('click', async () => {
            try {
              await api('DELETE', `/notes/${note.id}`);
              await loadNotes();
            } catch (error) {
              showError(error);
            }
          });
          item.append(title, body, remove);
          list.append(item);
        }
      } catch (error) {
        showError(error);
      }
    }

    document.querySelector('#new-note').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.target;
      const { title, body } = Object.fromEntries(new FormData(form));
      try {
        await api('POST', '/notes', { title, body });
        form.reset();
        await loadNotes();
      } catch (error) {
        showError(error);
      }
    });

    await loadNotes();
  </script>
</body>
</html>
