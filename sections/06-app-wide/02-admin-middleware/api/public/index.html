<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>メモ</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
    form, section { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    input, textarea { display: block; margin: 0.25rem 0 0.75rem; padding: 0.4rem; width: 100%; box-sizing: border-box; }
    ul { list-style: none; padding: 0; }
    li { border-top: 1px solid #eee; padding: 0.5rem 0; }
    li p { margin: 0.25rem 0; white-space: pre-wrap; }
    li small { display: block; color: #666; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>メモ</h1>
  <p id="message" class="error"></p>

  <section>
    <h2>サインイン</h2>
    <p id="status">サインインしていません</p>
    <form id="sign-in">
      <label>メールアドレス <input name="email" type="email" required></label>
      <label>パスワード <input name="password" type="password" required></label>
      <button>サインイン</button>
    </form>
    <button id="sign-out" hidden>サインアウト</button>
    <details>
      <summary>アクセストークンの中身</summary>
      <pre id="claims">サインインすると表示します</pre>
    </details>
  </section>

  <form id="new-note">
    <h2>メモを追加する</h2>
    <label>タイトル <input name="title" required maxlength="100"></label>
    <label>本文 <textarea name="body" maxlength="1000"></textarea></label>
    <button>追加する</button>
  </form>

  <section>
    <h2>メモの一覧</h2>
    <ul id="notes"></ul>
  </section>

  <script type="module">
    const message = document.querySelector('#message');
    const list = document.querySelector('#notes');

    // ---- サインインの状態 ----

    // 練習なので sessionStorage に置く（タブを閉じると消える）。XSS があると読まれてしまう場所なので、本番では置き場所を考える
    let session = JSON.parse(sessionStorage.getItem('session') ?? 'null');

    function saveSession(next) {
      session = next;
      if (session) sessionStorage.setItem('session', JSON.stringify(session));
      else sessionStorage.removeItem('session');
      renderSession();
    }

    // JWT の真ん中（ペイロード）を読む。署名は確かめない（表示するだけなので。確かめるのは API の仕事）
    function decodeJwt(token) {
      const payload = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(payload), (c) => c.charCodeAt(0))));
    }

    function renderSession() {
      document.querySelector('#status').textContent = session ? `${session.email} でサインイン中` : 'サインインしていません';
      document.querySelector('#sign-in').hidden = Boolean(session);
      document.querySelector('#sign-out').hidden = !session;
      document.querySelector('#claims').textContent = session
        ? JSON.stringify(decodeJwt(session.accessToken), null, 2)
        : 'サインインすると表示します';
    }

    // API を呼ぶ。この HTML と API は同じサーバー（http://localhost:3000）から出ているので、パスだけで呼べる
    async function api(method, path, body) {
      const headers = {};
      if (body) headers['content-type'] = 'application/json';
      // サインインしていれば、アクセストークンを付けて「誰からの呼び出しか」を API に伝える
      if (session) headers.authorization = `Bearer ${session.accessToken}`;
      const response = await fetch(path, { method, headers, body: body && JSON.stringify(body) });
      if (!response.ok) {
        // NestJS のエラーは {"message": ..., "statusCode": ...} の形で返る
        const error = await response.json().catch(() => ({}));
        throw new Error(`${response.status} ${error.message ?? response.statusText}`);
      }
      return response.status === 204 ? null : response.json();
    }

    function showError(error) {
      message.textContent = error.message;
    }

    async function loadNotes() {
      list.replaceChildren();
      try {
        const notes = await api('GET', '/notes');
        message.textContent = '';
        if (notes.length === 0) list.textContent = 'メモはまだありません';
        for (const note of notes) {
          // textContent で入れる（innerHTML にすると、メモに書いた HTML が動いてしまう）
          const item = document.createElement('li');
          const title = document.createElement('strong');
          title.textContent = note.title;
          const body = document.createElement('p');
          body.textContent = note.body;
          // 持ち主（作った人の sub）。admin でサインインすると、他の人のメモも並ぶ
          const owner = document.createElement('small');
          owner.textContent = `持ち主: ${note.ownerId}`;
          const remove = document.createElement('button');
          remove.textContent = '削除';
          remove.addEventListener('click', async () => {
            try {
              await api('DELETE', `/notes/${note.id}`);
              await loadNotes();
            } catch (error) {
              showError(error);
            }
          });
          item.append(title, body, owner, remove);
          list.append(item);
        }
      } catch (error) {
        showError(error);
      }
    }

    document.querySelector('#new-note').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.target;
      const { title, body } = Object.fromEntries(new FormData(form));
      try {
        await api('POST', '/notes', { title, body });
        form.reset();
        await loadNotes();
      } catch (error) {
        showError(error);
      }
    });

    // ---- Cognito の API を直接呼ぶ ----

    // ユーザープール ID とクライアント ID は、API の /auth/config から受け取る（api/.env の値）
    const config = await (await fetch('/auth/config')).json();
    // Cognito の API の入口。リージョンはユーザープール ID の「_」より前（ap-northeast-1 など）
    const cognitoEndpoint = `https://cognito-idp.${config.userPoolId?.split('_')[0]}.amazonaws.com/`;

    // Cognito の API を 1 つ呼ぶ。流れが見えるように、AWS SDK も Amplify も使わずに fetch で書く。
    // InitiateAuth などは、AWS の認証情報（署名）なしで、クライアント ID だけで呼べる
    async function cognito(action, params) {
      if (!config.userPoolId || !config.clientId) throw new Error('api/.env にユーザープール ID とクライアント ID を書いて、API を起動し直してください');
      const response = await fetch(cognitoEndpoint, {
        method: 'POST',
        headers: {
          'content-type': 'application/x-amz-json-1.1',
          'x-amz-target': `AWSCognitoIdentityProviderService.${action}`,
        },
        body: JSON.stringify({ ClientId: config.clientId, ...params }),
      });
      const json = await response.json().catch(() => ({}));
      // 失敗すると {"__type":"NotAuthorizedException","message":"..."} の形で返る
      if (!response.ok) throw new Error(`${json.__type}: ${json.message}`);
      return json;
    }

    document.querySelector('#sign-in').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.target;
      const { email, password } = Object.fromEntries(new FormData(form));
      try {
        let result = await cognito('InitiateAuth', {
          AuthFlow: 'USER_PASSWORD_AUTH',
          AuthParameters: { USERNAME: email, PASSWORD: password },
        });
        // コンソールで作ったユーザーは、最初のサインインで新しいパスワードを決める（チャレンジ）
        if (result.ChallengeName === 'NEW_PASSWORD_REQUIRED') {
          const newPassword = prompt('新しいパスワードを決めてください');
          if (!newPassword) return;
          result = await cognito('RespondToAuthChallenge', {
            ChallengeName: 'NEW_PASSWORD_REQUIRED',
            Session: result.Session,
            ChallengeResponses: { USERNAME: email, NEW_PASSWORD: newPassword },
          });
        }
        if (!result.AuthenticationResult) throw new Error(`${result.ChallengeName} には対応していません`);
        form.reset();
        message.textContent = '';
        saveSession({ email, accessToken: result.AuthenticationResult.AccessToken });
        await loadNotes();
      } catch (error) {
        showError(error);
      }
    });

    document.querySelector('#sign-out').addEventListener('click', async () => {
      saveSession(null);
      await loadNotes();
    });

    renderSession();
    await loadNotes();
  </script>
</body>
</html>
