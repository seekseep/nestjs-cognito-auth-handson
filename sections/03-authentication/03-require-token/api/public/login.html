<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>ログイン</title>
</head>
<body>
  <h1>ログイン</h1>

  <form id="log-in">
    <label>メールアドレス <input name="email" type="email" required></label>
    <label>パスワード <input name="password" type="password" required></label>
    <button>ログイン</button>
  </form>

  <p id="message"></p>

  <p>アクセストークン</p>
  <textarea id="token" rows="8" cols="80" readonly></textarea>

  <script type="module">
    import { cognito } from './cognito.js';

    const message = document.querySelector('#message');

    // メールアドレスとパスワードを Cognito に送り、トークンを受け取る
    document.querySelector('#log-in').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = new FormData(event.target);
      try {
        const result = await cognito('InitiateAuth', {
          AuthFlow: 'USER_PASSWORD_AUTH',
          AuthParameters: { USERNAME: form.get('email'), PASSWORD: form.get('password') },
        });
        // API を呼ぶときに付けるのは、アクセストークン
        document.querySelector('#token').value = result.AuthenticationResult.AccessToken;
        message.textContent = 'ログインできました';
      } catch (error) {
        message.textContent = error.message;
      }
    });
  </script>
</body>
</html>
